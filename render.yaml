services:
  - type: web
    name: herbarium-api
    env: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && python manage.py seed_demo && gunicorn server.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: herbarium-api.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://herbarium-api.onrender.com,https://herbariium.netlify.app
      - key: CORS_ALLOWED_ORIGINS
        value: https://herbariium.netlify.app,https://herbarium-api.onrender.com
      - key: SECRET_KEY
        generateValue: true
